name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Web & Android Project
        run: |
          npm install
          npm run build
          npx cap add android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(p)) {
              let m = fs.readFileSync(p, "utf8");
              if (!m.includes("POST_NOTIFICATIONS")) {
                m = m.replace("<application", "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />\n    <application");
                fs.writeFileSync(p, m);
                console.log("Injected Android notification permissions successfully.");
              }
            }
          '
          cp logo.jpeg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp logo.jpg android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abacus-Kids-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
