<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B6B" />
  <meta name="description" content="Abacus Kids - The Abacus Academy, Jodhpur: Colorful, interactive offline-ready kids learning app for Nursery, LKG, UKG, Picture World, and Brain Booster." />
  <title>Abacus Kids - The Abacus Academy, Jodhpur</title>
  <style>
    :root {
      --primary: #FF5252;
      --secondary: #4CAF50;
      --accent: #FF9800;
      --blue: #2196F3;
      --purple: #9C27B0;
      --pink: #E91E63;
      --bg: #FFFDF9;
      --card-bg: #FFFFFF;
      --text-dark: #2C3E50;
      --border-radius: 20px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #F4F7FB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      touch-action: manipulation;
    }
    #app-container {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.08);
      overflow-x: hidden;
    }
    /* Sticky Top Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #FFE082;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
      background: #FFF9C4;
      border: 2px solid #FBC02D;
    }
    .academy-badge {
      font-size: 10px;
      font-weight: 800;
      color: #E65100;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .app-title {
      font-size: 19px;
      font-weight: 900;
      color: #D84315;
      line-height: 1.2;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .star-counter {
      background: #FFF8E1;
      border: 2px solid #FFD54F;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 900;
      color: #F57F17;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(255, 213, 79, 0.3);
    }
    .nav-icon-btn {
      background: #FFFFFF;
      border: 2px solid #CFD8DC;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #455A64;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .nav-icon-btn:active {
      transform: scale(0.92);
    }

    /* Sub Tabs Nav */
    .subtabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 2px solid #ECEFF1;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .subtabs-bar::-webkit-scrollbar {
      display: none;
    }
    .subtab-chip {
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      border: 2px solid #E0E0E0;
      background: #FFFFFF;
      color: #607D8B;
      cursor: pointer;
      transition: all 0.2s;
    }
    .subtab-chip.active {
      background: var(--active-color, #2196F3);
      color: #FFFFFF;
      border-color: var(--active-color, #2196F3);
      box-shadow: 0 3px 8px rgba(33, 150, 243, 0.3);
      transform: translateY(-1px);
    }

    /* Main Container Content */
    .main-content {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    /* Common Card Styles */
    .interactive-card {
      background: #FFFFFF;
      border-radius: 22px;
      border: 3px solid #E0E0E0;
      box-shadow: 0 6px 0 #CFD8DC;
      transition: transform 0.1s, box-shadow 0.1s;
      cursor: pointer;
    }
    .interactive-card:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #CFD8DC;
    }

    /* Big Hero Screen Card */
    .hero-banner {
      background: linear-gradient(135deg, #FFF9C4 0%, #FFE082 100%);
      border: 3px solid #FBC02D;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 5px 15px rgba(251, 192, 45, 0.25);
    }

    /* Home Navigation Grid */
    .home-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .home-section-btn {
      width: 100%;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .home-section-btn:active {
      transform: scale(0.97);
    }
    .section-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      color: #fff;
      margin-bottom: 4px;
    }
    .section-name {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }
    .section-desc {
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
    }

    /* Nursery Button Colors */
    .btn-nursery {
      background: #E1F5FE;
      border-color: #03A9F4;
      box-shadow: 0 5px 0 #0288D1;
    }
    .btn-nursery .section-name { color: #01579B; }
    .btn-nursery .section-desc { color: #0288D1; }

    /* LKG Button Colors */
    .btn-lkg {
      background: #F1F8E9;
      border-color: #8BC34A;
      box-shadow: 0 5px 0 #689F38;
    }
    .btn-lkg .section-name { color: #33691E; }
    .btn-lkg .section-desc { color: #558B2F; }

    /* UKG Button Colors */
    .btn-ukg {
      background: #FFF3E0;
      border-color: #FF9800;
      box-shadow: 0 5px 0 #F57C00;
    }
    .btn-ukg .section-name { color: #E65100; }
    .btn-ukg .section-desc { color: #FB8C00; }

    /* Picture World & Brain Booster Grid */
    .dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .btn-picworld {
      background: #F3E5F5;
      border: 3px solid #BA68C8;
      box-shadow: 0 5px 0 #8E24AA;
      border-radius: 22px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
    }
    .btn-picworld .section-name { color: #4A148C; font-size: 17px; }
    .btn-picworld .section-desc { color: #7B1FA2; font-size: 11px; }

    .btn-brain {
      background: #FCE4EC;
      border: 3px solid #F06292;
      box-shadow: 0 5px 0 #D81B60;
      border-radius: 22px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
    }
    .btn-brain .section-name { color: #880E4F; font-size: 17px; }
    .btn-brain .section-desc { color: #C2185B; font-size: 11px; }

    /* Flashcard Large View */
    .flashcard {
      background: #FFFFFF;
      border: 4px solid #90CAF9;
      border-radius: 28px;
      padding: 24px 16px;
      text-align: center;
      margin: 10px auto;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.15);
      cursor: pointer;
      position: relative;
    }
    .flashcard:active {
      transform: scale(0.97);
    }
    .flashcard-emoji {
      font-size: 84px;
      line-height: 1.1;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }
    .flashcard-title {
      font-size: 26px;
      font-weight: 900;
      color: #1976D2;
    }
    .flashcard-sub {
      font-size: 15px;
      font-weight: 700;
      color: #546E7A;
      margin-top: 4px;
    }
    .audio-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E3F2FD;
      color: #1565C0;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      margin-top: 10px;
    }

    /* Option Grids */
    .options-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .options-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .options-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .opt-btn {
      background: #FFFFFF;
      border: 3px solid #81D4FA;
      box-shadow: 0 5px 0 #29B6F6;
      border-radius: 20px;
      padding: 16px 8px;
      font-size: 24px;
      font-weight: 900;
      color: #0277BD;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .opt-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #29B6F6;
    }

    /* Small Grid items (A-Z & Swar Grid) */
    .grid-items-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 8px;
      max-height: calc(100vh - 210px);
      overflow-y: auto;
      padding: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .item-chip-card {
      background: #FFFFFF;
      border: 2px solid #E0E0E0;
      border-radius: 18px;
      padding: 10px 4px;
      text-align: center;
      box-shadow: 0 3px 0 #EEEEEE;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .item-chip-card:active {
      transform: scale(0.92);
    }
    .chip-letter {
      font-size: 22px;
      font-weight: 900;
      color: #2E7D32;
    }
    .chip-emoji {
      font-size: 28px;
      margin: 4px 0;
    }
    .chip-word {
      font-size: 10px;
      font-weight: 700;
      color: #616161;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Word Building & Puzzle Chips */
    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
    }
    .slot-box {
      width: 54px;
      height: 54px;
      border: 3px dashed #90A4AE;
      border-radius: 16px;
      background: #ECEFF1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #263238;
    }
    .slot-box.filled {
      border: 3px solid #4CAF50;
      background: #E8F5E9;
      color: #2E7D32;
    }
    .letters-tray {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .letter-bubble {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #FFEB3B;
      border: 3px solid #FBC02D;
      box-shadow: 0 4px 0 #F57F17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #795548;
      cursor: pointer;
      transition: all 0.1s;
    }
    .letter-bubble:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #F57F17;
    }

    /* Memory Flip Game */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 380px;
      margin: 14px auto;
    }
    .memory-card {
      aspect-ratio: 1;
      perspective: 1000px;
      cursor: pointer;
    }
    .memory-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s;
      transform-style: preserve-3d;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .memory-card.flipped .memory-card-inner {
      transform: rotateY(180deg);
    }
    .memory-front, .memory-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      font-size: 32px;
      border: 3px solid transparent;
    }
    .memory-front {
      background: linear-gradient(135deg, #FF80AB 0%, #FF4081 100%);
      color: #fff;
      border-color: #F50057;
      font-weight: 900;
    }
    .memory-back {
      background: #FFFFFF;
      border-color: #4CAF50;
      transform: rotateY(180deg);
    }

    /* Feedback Animations & Toast */
    .toast-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(33, 33, 33, 0.92);
      color: #fff;
      padding: 18px 32px;
      border-radius: 30px;
      font-size: 26px;
      font-weight: 900;
      z-index: 999;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .toast-overlay.show {
      transform: translate(-50%, -50%) scale(1);
    }
    .toast-overlay.success {
      background: linear-gradient(135deg, #43A047, #2E7D32);
      border: 3px solid #A5D6A7;
    }
    .toast-overlay.wrong {
      background: linear-gradient(135deg, #E53935, #C62828);
      border: 3px solid #EF9A9A;
    }

    /* Toggle Mode Switcher */
    .mode-switch {
      display: flex;
      justify-content: center;
      background: #ECEFF1;
      padding: 4px;
      border-radius: 18px;
      margin-bottom: 14px;
      gap: 6px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      color: #546E7A;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #FFFFFF;
      color: #1E88E5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Math Visual Counters */
    .math-counters-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
      padding: 10px;
      background: #FFFDE7;
      border-radius: 16px;
      border: 2px dashed #FFF59D;
    }
    .math-symbol {
      font-size: 32px;
      font-weight: 900;
      color: #E65100;
      margin: 0 6px;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 998;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- Top Sticky Header -->
    <header class="app-header">
      <div class="header-left">
        <img src="logo.jpeg" alt="Logo" class="logo-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'46\' fill=\'%23FF9800\'/><text x=\'50\' y=\'62\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\' font-family=\'sans-serif\' font-weight=\'bold\'>A</text></svg>';" />
        <div>
          <div class="academy-badge">The Abacus Academy, Jodhpur</div>
          <div class="app-title">Abacus Kids</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="star-counter" id="star-badge" title="Earned Stars">
          <span>⭐</span> <span id="star-count">0</span>
        </div>
        <button id="btn-sound-toggle" class="nav-icon-btn" onclick="toggleSound()" title="Sound On/Off">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="btn-home-nav" class="nav-icon-btn" onclick="goHome()" style="display:none;" title="Home">
          <span>🏠</span>
        </button>
      </div>
    </header>

    <!-- Sub Navigation Tabs Bar (Rendered dynamically when inside a section) -->
    <div id="subtabs-bar" class="subtabs-bar" style="display:none;"></div>

    <!-- Main Dynamic Content Container -->
    <main id="main-view" class="main-content">
      <!-- Content dynamically rendered here -->
    </main>

    <!-- Toast Overlay -->
    <div id="toast-overlay" class="toast-overlay"></div>
  </div>

  <script>
    /* =========================================================
       AUDIO & SPEECH SYNTHESIS ENGINE (100% Offline & WebView Safe)
       ========================================================= */
    var appSoundEnabled = true;
    var lastUtteranceKey = "";
    var currentSpeechTimeout = null;

    // Web Audio Synthesizer for rich playful sound effects
    var audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(type) {
      if (!appSoundEnabled) return;
      try {
        var ctx = getAudioContext();
        if (!ctx) return;
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "pop") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "success") {
          // Cheerful chime chord
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
          osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "win") {
          // Victory fanfare
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.12); // A5
          osc.frequency.setValueAtTime(1174.66, now + 0.25); // D6
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        }
      } catch (e) {
        // Safe fallback
      }
    }

    // Web Speech API
    var availableVoices = [];
    function loadVoices() {
      if (window.speechSynthesis) {
        availableVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text, lang) {
      if (!appSoundEnabled || !window.speechSynthesis || !text) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(String(text));
        var targetLang = lang || (containsHindi(text) ? "hi-IN" : "en-IN");
        utterance.lang = targetLang;
        utterance.rate = 0.88;
        utterance.pitch = 1.05;

        // Try to pick matching voice
        if (availableVoices.length > 0) {
          var matchedVoice = availableVoices.find(function(v) {
            return v.lang && v.lang.toLowerCase().indexOf(targetLang.toLowerCase().slice(0, 2)) !== -1;
          });
          if (matchedVoice) utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        // Ignore speech error
      }
    }

    function autoSpeak(key, text, lang) {
      if (lastUtteranceKey === key) return;
      lastUtteranceKey = key;
      if (currentSpeechTimeout) clearTimeout(currentSpeechTimeout);
      currentSpeechTimeout = setTimeout(function() {
        speak(text, lang);
      }, 300);
    }

    function containsHindi(str) {
      return /[\u0900-\u097F]/.test(str);
    }

    function toggleSound() {
      appSoundEnabled = !appSoundEnabled;
      document.getElementById("sound-icon").textContent = appSoundEnabled ? "🔊" : "🔇";
      if (!appSoundEnabled && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      } else if (appSoundEnabled) {
        playTone("pop");
        speak("Sound On", "en-IN");
      }
    }

    /* =========================================================
       CONFETTI CELEBRATION ENGINE
       ========================================================= */
    var confettiCanvas = document.getElementById("confetti-canvas");
    var confettiCtx = confettiCanvas.getContext("2d");
    var confettiParticles = [];
    var confettiAnimId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      confettiParticles = [];
      var colors = ["#FF5252", "#FFEB3B", "#4CAF50", "#2196F3", "#E040FB", "#FF9800"];
      for (var i = 0; i < 70; i++) {
        confettiParticles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height / 3,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.35,
          alpha: 1
        });
      }
      if (!confettiAnimId) renderConfetti();
    }

    function renderConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      var stillActive = false;
      for (var i = 0; i < confettiParticles.length; i++) {
        var p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.012;
        if (p.alpha > 0) {
          stillActive = true;
          confettiCtx.save();
          confettiCtx.globalAlpha = p.alpha;
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate((p.rotation * Math.PI) / 180);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          confettiCtx.restore();
        }
      }
      if (stillActive) {
        confettiAnimId = requestAnimationFrame(renderConfetti);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiAnimId = null;
      }
    }

    function getNumberWord(n) {
      var ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                  "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      var tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
      if (n <= 19) return ones[n];
      if (n === 100) return "One Hundred";
      var t = Math.floor(n / 10);
      var rem = n % 10;
      return tens[t] + (rem > 0 ? ("-" + ones[rem]) : "");
    }

    function tapWordLetter(char) {
      playTone("pop");
      var wordObj = DATA_SHABDA[appState.wordCurrentIndex % DATA_SHABDA.length];
      if (appState.wordSlots.length < wordObj.letters.length) {
        appState.wordSlots.push(char);
        renderCurrentView();

        // Check if finished
        if (appState.wordSlots.length === wordObj.letters.length) {
          var builtWord = appState.wordSlots.join("");
          if (builtWord === wordObj.word) {
            addStar("अद्भुत! " + wordObj.word, wordObj.sound + "! बहुत बढ़िया!", "hi-IN");
            setTimeout(function() {
              appState.wordCurrentIndex++;
              appState.wordSlots = [];
              renderCurrentView();
            }, 1300);
          } else {
            markWrong("गलत शब्द बना, दोबारा जोड़ें");

          var vowels = ["A", "E", "I", "O", "U"];
          html += '<div style="display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap;">';
          for (var v = 0; v < vowels.length; v++) {
            var isVowelOk = (vowels[v] === cvcQ.ans);
            html += '<button class="letter-bubble" style="background:#FFF3E0;border-color:#FF9800;color:#BF360C;" onclick="handleCvcAns(' + isVowelOk + ', \'' + cvcQ.sound + '\')">' + vowels[v] + '</button>';
          }
          html += '</div>';
        }
      }

      // TAB 1: सभी हिंदी मात्राएं
      else if (appState.tabIndex === 1) {
        html += '<div class="mode-switch">';
        html += '  <button class="mode-btn ' + (appState.mode === "learn" ? "active" : "") + '" onclick="setMode(\'learn\')">📖 सभी मात्राएं सीखें</button>';
        html += '  <button class="mode-btn ' + (appState.mode === "quiz" ? "active" : "") + '" onclick="setMode(\'quiz\')">🎯 मात्रा Quiz</button>';
        html += '</div>';

        if (appState.mode === "learn") {
          autoSpeak("matra_learn", "हिंदी की सभी प्रमुख मात्राएं. किसी भी मात्रा पर टैप करें!", "hi-IN");
          html += '<div style="max-height: calc(100vh - 210px); overflow-y: auto;">';
          for (var m = 0; m < DATA_MATRA.length; m++) {
            var mItem = DATA_MATRA[m];
            html += '<div class="interactive-card" style="padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-color: #FFCC80;" onclick="speak(\'' + mItem.sound + '\', \'hi-IN\')">';
            html += '  <div style="display: flex; align-items: center; gap: 12px;">';
            html += '    <div style="font-size: 32px;">' + mItem.emoji + '</div>';
            html += '    <div>';
            html += '      <div style="font-size: 17px; font-weight: 900; color: #E65100;">' + mItem.name + '</div>';
            html += '      <div style="font-size: 12px; font-weight: 700; color: #795548;">' + mItem.sound + '</div>';
            html += '    </div>';
            html += '  </div>';
            html += '  <div style="font-size: 24px; font-weight: 900; color: #D84315;">' + mItem.example + '</div>';
            html += '</div>';
          }
          html += '</div>';
        } else {
          // Matra Quiz
          var mqItem = DATA_MATRA[appState.quizIndex % DATA_MATRA.length];
          autoSpeak("matra_q_" + appState.quizIndex, mqItem.full + " में कौन सी मात्रा लगेगी?", "hi-IN");

          html += '<div class="flashcard" onclick="speak(\'' + mqItem.sound + '\', \'hi-IN\')">';
          html += '  <div class="flashcard-emoji">' + mqItem.emoji + '</div>';
          html += '  <div style="font-size: 32px; font-weight: 900; color: #D84315;">' + mqItem.missingPart + '</div>';
          html += '  <div class="audio-hint" style="background:#FFF3E0;color:#E65100;">🔊 ' + mqItem.full + '</div>';
          html += '</div>';

          html += '<div style="text-align: center; font-weight: 800; color: #455A64; margin-top: 6px;">सही मात्रा चुनो:</div>';
          html += '<div class="options-grid-3">';
          for (var mo = 0; mo < mqItem.options.length; mo++) {
            var isMatraOk = (mqItem.options[mo] === mqItem.ans);
            html += '<button class="opt-btn" style="border-color:#FFB74D;color:#E65100;font-size:32px;" onclick="handleMatraAns(' + isMatraOk + ', \'' + mqItem.sound + '\')">' + mqItem.options[mo] + '</button>';
          }
          html += '</div>';
        }
      }

      // TAB 2: Addition & Subtraction
      else if (appState.tabIndex === 2) {
        var op = (appState.quizIndex % 2 === 0) ? "+" : "-";
        var a = Math.floor(Math.random() * 4) + 3; // 3 to 6
        var b = Math.floor(Math.random() * 3) + 1; // 1 to 3
        if (op === "-" && a < b) {
          var tmp = a; a = b; b = tmp;
        }
        var correctMath = (op === "+") ? (a + b) : (a - b);
        var mathSpoken = (op === "+") ? (a + " plus " + b + " equals what?") : (a + " minus " + b + " equals what?");
        autoSpeak("math_q_" + appState.quizIndex, mathSpoken, "en-IN");

        html += '<div style="text-align:center;margin: 12px 0;">';
        html += '  <div style="font-size: 44px; font-weight: 900; color: #E65100;">' + a + ' ' + op + ' ' + b + ' = ?</div>';
        html += '  <div style="font-size: 13px; font-weight: bold; color: #795548;">Count the objects below:</div>';
        html += '</div>';

        // Visual Representation
        html += '<div class="math-counters-row" style="max-width: 340px; margin: 10px auto;">';
        // Group A
        for (var ga = 0; ga < a; ga++) {
          html += '<span style="font-size: 32px;">🍎</span>';
        }
        html += '<span class="math-symbol">' + op + '</span>';
        // Group B
        for (var gb = 0; gb < b; gb++) {
          var cross = (op === "-") ? ' style="filter: grayscale(1); opacity: 0.5;"' : '';
          html += '<span style="font-size: 32px;"' + cross + '>🍎</span>';
        }
        html += '</div>';

        var mathOpts = [correctMath, correctMath + 1, Math.max(0, correctMath - 1)].sort(function() { return Math.random() - 0.5; });

        html += '<div class="options-grid-3" style="max-width: 320px; margin: 18px auto 0;">';
        for (var mopt = 0; mopt < mathOpts.length; mopt++) {
          var isMathOk = (mathOpts[mopt] === correctMath);
          html += '<button class="opt-btn" onclick="handleMathAns(' + isMathOk + ', ' + correctMath + ')">' + mathOpts[mopt] + '</button>';
        }
        html += '</div>';
      }

      view.innerHTML = html;
    }

    function handleCvcAns(isCorrect, sound) {
      if (isCorrect) {
        addStar("Superb! " + sound, sound + "! Perfect!", "en-IN");
        setTimeout(function() {
          appState.quizIndex++;
          renderCurrentView();
        }, 1200);
      } else {
        markWrong("Wrong vowel, try again");
      }
    }

    function handleMatraAns(isCorrect, sound) {
      if (isCorrect) {
        addStar("शाबाश! सही मात्रा", sound, "hi-IN");
        setTimeout(function() {
          appState.quizIndex++;
          renderCurrentView();
        }, 1200);
      } else {
        markWrong("गलत मात्रा, फिर से देखो");
      }
    }

    function handleMathAns(isCorrect, ans) {
      if (isCorrect) {
        addStar("Correct! = " + ans, "Awesome! The answer is " + ans, "en-IN");
        setTimeout(function() {
          appState.quizIndex++;
          renderCurrentView();
        }, 1200);
      } else {
        markWrong("गिनती गलत है, फिर से जोड़ें");
      }
    }

    /* =========================================================
       SECTION 4: PICTURE WORLD VIEW (Learn & Quiz)
       ========================================================= */
    function renderPictureWorldView() {
      var view = document.getElementById("main-view");
      var categories = ["Animals", "Birds", "Fruits", "Vegetables", "Vehicles", "BodyParts"];
      var catName = categories[appState.tabIndex] || "Animals";
      var items = DATA_PICTURE_WORLD[catName] || [];

      var html = "";
      html += '<div class="mode-switch">';
      html += '  <button class="mode-btn ' + (appState.mode === "learn" ? "active" : "") + '" onclick="setMode(\'learn\')">📖 Picture Cards (सीखें)</button>';
      html += '  <button class="mode-btn ' + (appState.mode === "quiz" ? "active" : "") + '" onclick="setMode(\'quiz\')">🎯 Picture Quiz</button>';
      html += '</div>';

      if (appState.mode === "learn") {
        autoSpeak("pw_learn_" + catName, catName + ". Tap any card to hear pronunciation!", "en-IN");
        html += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: calc(100vh - 210px); overflow-y: auto; padding: 4px;">';
        for (var p = 0; p < items.length; p++) {
          var pItem = items[p];
          html += '<div class="interactive-card" style="padding: 14px; text-align: center; border-color: #CE93D8;" onclick="speak(\'' + pItem.en + ', ' + pItem.hi + '\', \'en-IN\')">';
          html += '  <div style="font-size: 52px; margin-bottom: 6px;">' + pItem.emoji + '</div>';
          html += '  <div style="font-size: 18px; font-weight: 900; color: #4A148C;">' + pItem.en + '</div>';
          html += '  <div style="font-size: 13px; font-weight: 700; color: #7B1FA2;">' + pItem.hi + '</div>';
          html += '</div>';
        }
        html += '</div>';
      } else {
        // Picture Quiz
        var targetPic = items[appState.quizIndex % items.length];
        autoSpeak("pw_q_" + appState.quizIndex, "Where is the " + targetPic.en + "? " + targetPic.hi + " कहाँ है?", "hi-IN");

        var pOpts = [targetPic];
        while (pOpts.length < 4) {
          var randP = items[Math.floor(Math.random() * items.length)];
          if (pOpts.indexOf(randP) === -1) pOpts.push(randP);
        }
        pOpts.sort(function() { return Math.random() - 0.5; });

        html += '<div style="text-align: center; margin: 12px 0 16px;">';
        html += '  <div style="font-size: 14px; font-weight: bold; color: #546E7A;">Find this picture (पहचानो):</div>';
        html += '  <div style="font-size: 30px; font-weight: 900; color: #6A1B9A;">' + targetPic.en + '</div>';
        html += '  <div style="font-size: 18px; font-weight: 700; color: #8E24AA;">(' + targetPic.hi + ')</div>';
        html += '</div>';

        html += '<div class="options-grid-4">';
        for (var po = 0; po < pOpts.length; po++) {
          var isPicOk = (pOpts[po].en === targetPic.en);
          html += '<button class="opt-btn" style="border-color:#BA68C8;box-shadow:0 5px 0 #8E24AA;padding:18px 8px;" onclick="handlePicWorldAns(' + isPicOk + ', \'' + targetPic.en + '\', \'' + targetPic.hi + '\')">';
          html += '  <span style="font-size: 52px;">' + pOpts[po].emoji + '</span>';
          html += '</button>';
        }
        html += '</div>';
      }

      view.innerHTML = html;
    }

    function handlePicWorldAns(isCorrect, en, hi) {
      if (isCorrect) {
        addStar("शानदार! " + en, "Very good! That is " + en + ", " + hi, "en-IN");
        setTimeout(function() {
          appState.quizIndex++;
          renderCurrentView();
        }, 1200);
      } else {
        markWrong("यह नहीं है, दोबारा ढूंढें");
      }
    }

    /* =========================================================
       SECTION 5: BRAIN BOOSTER VIEW
       ========================================================= */
    function renderBrainBoosterView() {
      var view = document.getElementById("main-view");
      var html = "";

      // TAB 0: Shadow Match
      if (appState.tabIndex === 0) {
        var sTarget = DATA_SHADOWS[appState.brainIndex % DATA_SHADOWS.length];
        autoSpeak("shadow_q_" + appState.brainIndex, sTarget.sound, "hi-IN");

        html += '<div style="text-align: center; margin: 10px 0;">';
        html += '  <div style="font-size: 14px; font-weight: bold; color: #546E7A;">इस चित्र की सही परछाई (Shadow) चुनो:</div>';
        html += '  <div style="font-size: 74px; margin: 10px 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));">' + sTarget.emoji + '</div>';
        html += '  <div style="font-size: 20px; font-weight: 900; color: #880E4F;">' + sTarget.name + '</div>';
        html += '</div>';

        html += '<div class="options-grid-3">';
        for (var so = 0; so < sTarget.options.length; so++) {
          var isShadowOk = (sTarget.options[so] === sTarget.correct);
          html += '<button class="opt-btn" style="border-color:#F48FB1;box-shadow:0 5px 0 #D81B60;" onclick="handleShadowAns(' + isShadowOk + ', \'' + sTarget.name + '\')">';
          // CSS Silhouette shadow filter
          html += '  <span style="font-size: 48px; filter: brightness(0) opacity(0.85);">' + sTarget.options[so] + '</span>';
          html += '</button>';
        }
        html += '</div>';
      }

      // TAB 1: Odd One Out
      else if (appState.tabIndex === 1) {
        var oddObj = DATA_ODD_OUT[appState.brainIndex % DATA_ODD_OUT.length];
        autoSpeak("odd_q_" + appState.brainIndex, "Find the odd one out. इनमें से अलग क्या है?", "hi-IN");

        html += '<div style="text-align: center; margin: 12px 0 16px;">';
        html += '  <div style="font-size: 18px; font-weight: 900; color: #880E4F;">' + oddObj.question + '</div>';
        html += '  <div style="font-size: 12px; font-weight: bold; color: #546E7A;">जो सबसे अलग है, उस पर टैप करें:</div>';
        html += '</div>';

        html += '<div class="options-grid-4">';
        for (var oi = 0; oi < oddObj.items.length; oi++) {
          var itm = oddObj.items[oi];
          html += '<button class="opt-btn" style="border-color:#F48FB1;box-shadow:0 5px 0 #D81B60;padding:20px 8px;" onclick="handleOddAns(' + itm.isOdd + ', \'' + (itm.reason || "Good job!") + '\')">';
          html += '  <span style="font-size: 52px;">' + itm.emoji + '</span>';
          html += '</button>';
        }
        html += '</div>';
      }

      // TAB 2: Memory Flip Game
      else if (appState.tabIndex === 2) {
        if (!appState.memCards || appState.memCards.length === 0) {
          initMemoryGame();
        }

        html += '<div style="text-align: center; margin-bottom: 8px;">';
        html += '  <div style="font-size: 18px; font-weight: 900; color: #880E4F;">Memory Flip Game (जोड़ी मिलाओ)</div>';
        html += '  <div style="font-size: 12px; font-weight: bold; color: #546E7A;">Matched: ' + appState.memMatched.length + ' / ' + (appState.memCards.length / 2) + ' pairs</div>';
        html += '</div>';

        html += '<div class="memory-grid">';
        for (var mi = 0; mi < appState.memCards.length; mi++) {
          var cardIcon = appState.memCards[mi];
          var isFlipped = (appState.memFlipped.indexOf(mi) !== -1 || appState.memMatched.indexOf(cardIcon) !== -1);
          var flipCls = isFlipped ? " flipped" : "";
          html += '<div class="memory-card' + flipCls + '" onclick="tapMemoryCard(' + mi + ')">';
          html += '  <div class="memory-card-inner">';
          html += '    <div class="memory-front">⭐</div>';
          html += '    <div class="memory-back">' + cardIcon + '</div>';
          html += '  </div>';
          html += '</div>';
        }
        html += '</div>';

        html += '<div style="text-align: center; margin-top: 10px;">';
        html += '  <button class="nav-icon-btn" style="margin: 0 auto;" onclick="initMemoryGame()">🔄 New Game (नया खेल)</button>';
        html += '</div>';
      }

      view.innerHTML = html;
    }

    function initMemoryGame() {
      var pool = ["🦁", "🍎", "🚗", "🦚", "🐘", "⭐"];
      var doublePool = pool.concat(pool);
      doublePool.sort(function() { return Math.random() - 0.5; });
      appState.memCards = doublePool;
      appState.memFlipped = [];
      appState.memMatched = [];
      autoSpeak("mem_init", "Memory Flip Game. Tap cards to find matching pairs!", "en-IN");
    }

    function tapMemoryCard(idx) {
      if (appState.memFlipped.length >= 2) return;
      if (appState.memFlipped.indexOf(idx) !== -1) return;
      var cardIcon = appState.memCards[idx];
      if (appState.memMatched.indexOf(cardIcon) !== -1) return;

      playTone("pop");
      appState.memFlipped.push(idx);
      renderCurrentView();

      if (appState.memFlipped.length === 2) {
        var idx1 = appState.memFlipped[0];
        var idx2 = appState.memFlipped[1];
        var icon1 = appState.memCards[idx1];
        var icon2 = appState.memCards[idx2];

        if (icon1 === icon2) {
          appState.memMatched.push(icon1);
          addStar("जोड़ी मिल गई! (Pair Matched!)", "Match found! Super!", "en-IN");
          appState.memFlipped = [];

          if (appState.memMatched.length === appState.memCards.length / 2) {
            setTimeout(function() {
              playTone("win");
              showToast("🏆 You Won the Game!", "success");
              speak("Congratulations! You matched all pairs!", "en-IN");
            }, 600);
          }
        } else {
          setTimeout(function() {
            playTone("wrong");
            appState.memFlipped = [];
            renderCurrentView();
          }, 850);
        }
      }
    }

    function handleShadowAns(isCorrect, name) {
      if (isCorrect) {
        addStar("सही Shadow! (Great Match)", "Perfect shadow of " + name, "en-IN");
        setTimeout(function() {
          appState.brainIndex++;
          renderCurrentView();
        }, 1200);
      } else {
        markWrong("यह सही परछाई नहीं है");
      }
    }

    function handleOddAns(isOdd, reason) {
      if (isOdd) {
        addStar("बिल्कुल सही! (Odd One Out)", reason, "en-IN");
        setTimeout(function() {
          appState.brainIndex++;
          renderCurrentView();
        }, 1300);
      } else {
        markWrong("यह अलग नहीं है, ध्यान से देखो");
      }
    }

    /* =========================================================
       MASTER VIEW RENDER DISPATCHER
       ========================================================= */
    function renderCurrentView() {
      if (appState.section === "home") {
        renderHome();
      } else if (appState.section === "nursery") {
        renderNurseryView();
      } else if (appState.section === "lkg") {
        renderLkgView();
      } else if (appState.section === "ukg") {
        renderUkgView();
      } else if (appState.section === "picture_world") {
        renderPictureWorldView();
      } else if (appState.section === "brain_booster") {
        renderBrainBoosterView();
      }
    }

    // Initial load
    window.addEventListener("DOMContentLoaded", function() {
      // Unlock audio on first user gesture
      document.body.addEventListener("click", function() {
        getAudioContext();
      }, { once: true });

      goHome();
    });
  </script>
</body>
</html>
