    // --- AUDIO & SPEECH ENGINE ---
    function speak(text, lang = 'en-IN') {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.85;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    }

    function playTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.09);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.5, now + 0.3);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.25);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function handleLkgTap(ch) {
      const item = LKG_WORDS[state.qIdx % LKG_WORDS.length];
      playTone('pop');
      speak(ch, item.lang);
      state.builtLetters.push(ch);
      if (state.builtLetters.length === item.letters.length) {
        if (state.builtLetters.join('') === item.letters.join('')) {
          setTimeout(() => { speak(item.word, item.lang); addStar(); }, 350);
        } else {
          setTimeout(() => { state.builtLetters = []; wrongAns(); }, 350);
        }
      } else {
        render();
      }
    }

        wrongAns();

            ${list.map(it => `
              <button onclick="${state.picQuizMode ? (it.en === state.picTarget?.en ? `speak('${it.en}. ${it.hi}'); state.picTarget = list[Math.floor(Math.random()*list.length)]; addStar()` : 'wrongAns()') : `playTone('pop'); speak('${it.en}. ${it.hi}')`}"
                class="btn-3d bg-white border-2 border-b-4 border-purple-300 rounded-3xl p-4 flex flex-col items-center">
                <span class="text-6xl mb-2">${it.e}</span>
                <span class="text-base font-extrabold text-slate-800">${it.en}</span>
                <span class="text-xs font-bold text-purple-700">${it.hi}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderBrain() {
      const tabs = ['👤 Shadow Match', '🔍 Odd One Out'];
      let body = '';
      if (state.tab === 0) {
        const item = SHADOW_DATA[state.qIdx % SHADOW_DATA.length];
        body = `
          <div class="text-center anim-pop">
            <div class="text-xs font-bold text-pink-800 mb-3">यह किसकी परछाई (Shadow) है? पहचानें!</div>
            <div class="mx-auto w-36 h-36 bg-white border-2 border-pink-200 rounded-3xl flex items-center justify-center mb-5">
              <span class="text-7xl" style="filter: brightness(0); opacity: 0.85;">${item.target}</span>
            </div>
            <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto">
              ${item.opts.map(o => `
                <button onclick="${o === item.target ? `speak('${item.name}'); addStar()` : 'wrongAns()'}"
                  class="btn-3d bg-white border-2 border-b-4 border-pink-400 rounded-2xl py-4 text-5xl">
                  ${o}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        const item = ODD_DATA[state.qIdx % ODD_DATA.length];
        body = `
          <div class="text-center anim-pop">
            <div class="text-xs font-bold text-pink-800 mb-4">इनमें से सबसे अलग (Odd One Out) क्या है?</div>
            <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto">
              ${item.items.map(o => `
                <button onclick="${o === item.ans ? `speak('Correct!'); addStar()` : 'wrongAns()'}"
                  class="btn-3d bg-white border-2 border-b-4 border-pink-400 rounded-3xl py-6 text-5xl font-extrabold text-slate-800">
                  ${o}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
      return headerHTML('Brain Booster', 'text-[#D81B60]') + tabsHTML(tabs, 'bg-[#D81B60]') + `<div class="p-4 flex-1">${body}</div>`;
    }

    function render() {
      const root = document.getElementById('app');
      let html = '';
      if (state.screen === 'home') html = renderHome();
      else if (state.screen === 'nursery') html = renderNursery();
      else if (state.screen === 'lkg') html = renderLKG();
      else if (state.screen === 'ukg') html = renderUKG();
      else if (state.screen === 'pictures') html = renderPictures();
      else if (state.screen === 'brain') html = renderBrain();

      if (state.feedback === 'ok') {
        html += `<div class="fixed inset-0 pointer-events-none flex items-center justify-center z-50"><div class="bg-emerald-500 text-white px-7 py-4 rounded-3xl text-3xl font-extrabold shadow-xl anim-pop">🌟 शाबाश! +1 ⭐</div></div>`;
      } else if (state.feedback === 'no') {
        html += `<div class="fixed inset-0 pointer-events-none flex items-center justify-center z-50"><div class="bg-rose-500 text-white px-6 py-3 rounded-3xl text-xl font-extrabold shadow-xl anim-shake">फिर से कोशिश करें! 💪</div></div>`;
      }
      root.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
