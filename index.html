  <script>
    var lastSpoken = "";

    function speak(text, lang) {
      try {
        if (!window.speechSynthesis || !text) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = lang || "en-IN";
        u.rate = 0.88;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function autoSpeak(key, text, lang) {
      if (lastSpoken === key) return;
      lastSpoken = key;
      setTimeout(function() { speak(text, lang); }, 250);
    }

    function playTone(type) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        var now = ctx.currentTime;
        osc.type = type === "wrong" ? "sawtooth" : "sine";
        osc.frequency.setValueAtTime(type === "wrong" ? 200 : 520, now);
        osc.frequency.exponentialRampToValueAtTime(type === "wrong" ? 140 : 880, now + 0.18);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }
