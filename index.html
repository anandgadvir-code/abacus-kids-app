    function speak(text, lang) {
      try {
        if (!window.speechSynthesis || !text) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = lang || "en-IN";
        u.rate = 0.88;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function autoSpeak(key, text, lang) {
      if (lastSpoken === key) return;
      lastSpoken = key;
      setTimeout(function() { speak(text, lang); }, 250);
    }

    function playTone(type) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        var now = ctx.currentTime;
        osc.type = type === "wrong" ? "sawtooth" : "sine";
        osc.frequency.setValueAtTime(type === "wrong" ? 200 : 540, now);
        osc.frequency.exponentialRampToValueAtTime(type === "wrong" ? 140 : 880, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {}
    }

    function setPicCat(c) { playTone("pop"); state.picCat = c; state.picQuiz = false; render(); }

    function togglePicQuiz() {
      var list = PIC_WORLD[state.picCat];
      state.picQuiz = !state.picQuiz;
      state.picTarget = list[Math.floor(Math.random() * list.length)];
      if (state.picQuiz && state.picTarget) speak("Where is " + state.picTarget.en);
      render();
    }

    function tapPic(idx) {
      var list = PIC_WORLD[state.picCat];
      var it = list[idx];
      if (!state.picQuiz) { playTone("pop"); speak(it.en + ". " + it.hi); }
      else if (state.picTarget && it.en === state.picTarget.en) {
        speak(it.en + ". " + it.hi);
        state.picTarget = list[Math.floor(Math.random() * list.length)];
        setTimeout(function() { if (state.picTarget) speak("Where is " + state.picTarget.en); }, 1200);
        addStar();
      } else { wrongAns(); }
    }

      var cats = Object.keys(PIC_WORLD);

      for (var i = 0; i < cats.length; i++) {

    function flipCard(idx) {
      if (state.memOpen.length >= 2 || state.memOpen.indexOf(idx) !== -1 || state.memDone.indexOf(idx) !== -1) return;
      playTone("pop");
      state.memOpen.push(idx);
      render();
      if (state.memOpen.length === 2) {
        var a = state.memOpen[0], b = state.memOpen[1];
        if (state.memCards[a] === state.memCards[b]) {
          state.memDone.push(a, b);
          state.memOpen = [];
          state.stars += 1;
          playTone("success");
          speak("Match!");
          if (state.memDone.length === state.memCards.length) { setTimeout(function() { initMem(); render(); }, 1100); }
          else { render(); }
        } else { setTimeout(function() { state.memOpen = []; render(); }, 700); }
      }
    }
