<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF5252" />
  <meta name="description" content="Abacus Kids - The Abacus Academy, Jodhpur: English Medium IXL, Starfall & NCERT Balvatika learning app with Hybrid Native TTS, Phonics, EVS, and Math." />
  <title>Abacus Kids - The Abacus Academy, Jodhpur</title>
  <style>
    :root {
      --primary: #FF5252;
      --secondary: #4CAF50;
      --accent: #FF9800;
      --blue: #2196F3;
      --purple: #9C27B0;
      --pink: #E91E63;
      --teal: #009688;
      --bg: #FFFDF9;
      --card-bg: #FFFFFF;
      --text-dark: #2C3E50;
      --border-radius: 20px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #F4F7FB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      touch-action: manipulation;
    }
    #app-container {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.08);
      overflow-x: hidden;
    }

    /* Sticky Top Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #FFE082;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
      background: #FFF9C4;
      border: 2px solid #FBC02D;
      pointer-events: none;
    }
    .academy-badge {
      font-size: 10px;
      font-weight: 800;
      color: #E65100;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.1;
      pointer-events: none;
    }
    .app-title {
      font-size: 19px;
      font-weight: 900;
      color: #D84315;
      line-height: 1.2;
      pointer-events: none;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .star-counter {
      background: #FFF8E1;
      border: 2px solid #FFD54F;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 900;
      color: #F57F17;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(255, 213, 79, 0.3);
      cursor: pointer;
    }
    .nav-icon-btn {
      background: #FFFFFF;
      border: 2px solid #CFD8DC;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #455A64;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .nav-icon-btn:active {
      transform: scale(0.92);
    }

    /* High Performance Touch & Smooth Scroll Engine */
    button, .subtab-chip, .filter-pill, .mode-btn, .opt-btn, .letter-bubble,
    .interactive-card, .flashcard, .item-chip-card, .btn-next-question,
    .btn-listen-again, .nav-icon-btn, .home-section-btn, .hw-action-btn,
    .slot-box, .pool-letter, .login-role-btn, .modal-close-btn {
      touch-action: manipulation !important;
      -webkit-tap-highlight-color: transparent !important;
      cursor: pointer !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    /* Prevent child click event target mismatch so taps anywhere on cards trigger cleanly */
    .interactive-card > *, .item-chip-card > *, .flashcard > *, .home-section-btn > *,
    .opt-btn > *, .letter-bubble > *, .subtab-chip > *, .filter-pill > *, .mode-btn > * {
      pointer-events: none;
    }

    /* Sub Tabs Nav */
    .subtabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      scroll-behavior: smooth !important;
      white-space: nowrap !important;
      touch-action: pan-x pan-y !important;
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 2px solid #ECEFF1;
      scrollbar-width: none;
    }
    .subtabs-bar::-webkit-scrollbar {
      display: none;
    }

    /* Sub Tabs Nav (original duplicate placeholder) */
    .subtabs-bar-orig {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 2px solid #ECEFF1;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .subtabs-bar::-webkit-scrollbar {
      display: none;
    }
    .subtab-chip {
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      border: 2px solid #E0E0E0;
      background: #FFFFFF;
      color: #607D8B;
      cursor: pointer;
      transition: all 0.2s;
    }
    .subtab-chip.active {
      background: var(--active-color, #2196F3);
      color: #FFFFFF;
      border-color: var(--active-color, #2196F3);
      box-shadow: 0 3px 8px rgba(33, 150, 243, 0.3);
      transform: translateY(-1px);
    }

    /* Horizontal Filter Pills */
    .filter-pills-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      scroll-behavior: smooth !important;
      white-space: nowrap !important;
      touch-action: pan-x pan-y !important;
      padding: 6px 14px 10px;
      background: #FAFAFA;
      border-bottom: 1px solid #ECEFF1;
      scrollbar-width: none;
    }
    .filter-pills-bar::-webkit-scrollbar {
      display: none;
    }
    .filter-pill {
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      border: 1.5px solid #CFD8DC;
      background: #FFFFFF;
      color: #455A64;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-pill.active {
      background: #FF9800;
      color: #FFFFFF;
      border-color: #F57C00;
      box-shadow: 0 2px 6px rgba(255, 152, 0, 0.3);
    }

    /* Main Container Content */
    .main-content {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    /* Common Card Styles */
    .interactive-card {
      background: #FFFFFF;
      border-radius: 22px;
      border: 3px solid #E0E0E0;
      box-shadow: 0 4px 0 #CFD8DC;
      cursor: pointer;
      contain: layout style;
    }
    .interactive-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #CFD8DC;
    }

    /* Touch to speak interactive prompt styling */
    .touch-speak-item {
      cursor: pointer;
      display: inline-block;
      transition: transform 0.12s ease;
    }
    .touch-speak-item:active {
      transform: scale(0.95);
    }

    /* All inner emojis have pointer-events: none so clicks reliably hit the parent card */
    .safe-emoji {
      pointer-events: none;
      display: inline-block;
    }

    /* Big Hero Screen Card */
    .hero-banner {
      background: linear-gradient(135deg, #FFF9C4 0%, #FFE082 100%);
      border: 3px solid #FBC02D;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 5px 15px rgba(251, 192, 45, 0.25);
      cursor: pointer;
    }

    /* Home Navigation Grid */
    .home-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .home-section-btn {
      width: 100%;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-width: 3px;
      border-style: solid;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .home-section-btn:active {
      transform: scale(0.97);
    }
    .section-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      color: #fff;
      margin-bottom: 4px;
      pointer-events: none;
    }
    .section-name {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      pointer-events: none;
    }
    .section-desc {
      font-size: 12px;
      font-weight: 600;
      margin-top: 3px;
      pointer-events: none;
    }

    /* Nursery Button Colors */
    .btn-nursery {
      background: #E1F5FE;
      border-color: #03A9F4;
      box-shadow: 0 5px 0 #0288D1;
    }
    .btn-nursery .section-name { color: #01579B; }
    .btn-nursery .section-desc { color: #0288D1; }

    /* LKG Button Colors */
    .btn-lkg {
      background: #F1F8E9;
      border-color: #8BC34A;
      box-shadow: 0 5px 0 #689F38;
    }
    .btn-lkg .section-name { color: #33691E; }
    .btn-lkg .section-desc { color: #558B2F; }

    /* UKG Button Colors */
    .btn-ukg {
      background: #FFF3E0;
      border-color: #FF9800;
      box-shadow: 0 5px 0 #F57C00;
    }
    .btn-ukg .section-name { color: #E65100; }
    .btn-ukg .section-desc { color: #FB8C00; }

    /* Picture World & Brain Booster Grid */
    .dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .btn-picworld {
      background: #F3E5F5;
      border: 3px solid #BA68C8;
      box-shadow: 0 5px 0 #8E24AA;
      border-radius: 22px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
    }
    .btn-picworld .section-name { color: #4A148C; font-size: 17px; }
    .btn-picworld .section-desc { color: #7B1FA2; font-size: 11px; }

    .btn-brain {
      background: #FCE4EC;
      border: 3px solid #F06292;
      box-shadow: 0 5px 0 #D81B60;
      border-radius: 22px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
    }
    .btn-brain .section-name { color: #880E4F; font-size: 17px; }
    .btn-brain .section-desc { color: #C2185B; font-size: 11px; }

    /* Flashcard Large View */
    .flashcard {
      background: #FFFFFF;
      border: 4px solid #90CAF9;
      border-radius: 28px;
      padding: 24px 16px;
      text-align: center;
      margin: 10px auto;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.15);
      cursor: pointer;
      position: relative;
    }
    .flashcard:active {
      transform: scale(0.97);
    }
    .flashcard-emoji {
      font-size: 80px;
      line-height: 1.1;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      display: inline-block;
      pointer-events: none;
    }
    .flashcard-title {
      font-size: 26px;
      font-weight: 900;
      color: #1976D2;
      pointer-events: none;
    }
    .flashcard-sub {
      font-size: 15px;
      font-weight: 700;
      color: #546E7A;
      margin-top: 4px;
      pointer-events: none;
    }
    .audio-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #E3F2FD;
      color: #1565C0;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      margin-top: 10px;
      pointer-events: none;
    }

    /* Option Grids (Wide Kid-Friendly 2x2 and 3x2 Layouts) */
    .options-grid-3, .quiz-grid-6 {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 14px !important;
      width: 100% !important;
      max-width: 380px !important;
      margin: 14px auto 0 !important;
      box-sizing: border-box !important;
    }
    .options-grid-2, .options-grid-4, .quiz-grid-4 {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 14px !important;
      width: 100% !important;
      max-width: 360px !important;
      margin: 14px auto 0 !important;
      box-sizing: border-box !important;
    }
    .opt-btn {
      min-width: 74px !important;
      min-height: 66px !important;
      padding: 12px 18px !important;
      font-size: 1.75rem !important;
      font-weight: 900 !important;
      border-radius: 18px !important;
      display: inline-flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background: #FFFFFF;
      border: 3px solid #81D4FA;
      box-shadow: 0 5px 0 #29B6F6;
      color: #0277BD;
      cursor: pointer;
      box-sizing: border-box !important;
      touch-action: manipulation !important;
      text-align: center !important;
      width: 100% !important;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .opt-btn:active {
      transform: translateY(3px) !important;
      box-shadow: 0 2px 0 #29B6F6 !important;
    }
    /* When options have words/phrases (English World, EVS, Number Names, Picture World) */
    .opt-btn.has-text, .opt-btn-text, .word-opt {
      font-size: 1.15rem !important;
      min-height: 58px !important;
      padding: 10px 14px !important;
      line-height: 1.25 !important;
      word-break: break-word !important;
    }
    /* Option button child spans and labels */
    .opt-btn .opt-emoji {
      font-size: 32px !important;
      line-height: 1.1 !important;
      margin-bottom: 2px !important;
    }
    .opt-btn .opt-subtext {
      font-size: 14px !important;
      font-weight: 800 !important;
      color: #2C3E50 !important;
      margin-top: 2px !important;
    }
    /* Letter bubble in 2x2 or 3x2 option grids fills the cell with kid-friendly sizing */
    .options-grid-2 .letter-bubble,
    .options-grid-3 .letter-bubble,
    .quiz-grid-4 .letter-bubble,
    .quiz-grid-6 .letter-bubble {
      width: 100% !important;
      min-width: 74px !important;
      min-height: 66px !important;
      font-size: 1.75rem !important;
      border-radius: 18px !important;
      box-shadow: 0 5px 0 #F57F17 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    /* Order tile button in option grids */
    .options-grid-2 .order-tile-btn,
    .quiz-grid-4 .order-tile-btn {
      width: 100% !important;
      min-width: 74px !important;
      min-height: 66px !important;
      font-size: 1.75rem !important;
      border-radius: 18px !important;
      box-shadow: 0 5px 0 #81D4FA !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    /* Missing Letters & Numbers tile buttons */
    .missing-tile-btn {
      min-width: 64px !important;
      min-height: 58px !important;
      font-size: 1.65rem !important;
      border-radius: 16px !important;
      padding: 10px 16px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    /* Nursery Hindi Workbook Sizing & 3D Styling */
    .hindi-learn-card {
      min-height: 110px !important;
      padding: 12px 6px !important;
      border-radius: 20px !important;
      background: #FFFFFF !important;
      border: 3px solid #FFCCBC !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08) !important;
      cursor: pointer !important;
      transition: transform 0.1s ease !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .hindi-learn-card:active {
      transform: scale(0.93) !important;
    }
    .hindi-opt-btn {
      min-height: 70px !important;
      font-size: 1.9rem !important;
      font-weight: 900 !important;
      border-radius: 18px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
    }
    .hindi-order-grid {
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 10px !important;
      width: 100% !important;
      max-width: 420px !important;
      margin: 14px auto 0 !important;
    }
    .hindi-order-tile {
      min-height: 60px !important;
      font-size: 1.8rem !important;
      font-weight: 900 !important;
      border-radius: 16px !important;
      background: #FFF3E0 !important;
      border: 2.5px solid #FFB74D !important;
      color: #E65100 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08) !important;
      transition: transform 0.1s ease !important;
    }
    .hindi-order-tile:active {
      transform: scale(0.92) !important;
    }
    .hindi-order-tile.placed {
      opacity: 0.18 !important;
      pointer-events: none !important;
      background: #ECEFF1 !important;
      border-color: #CFD8DC !important;
      color: #B0BEC5 !important;
    }

    /* Small Grid items (A-Z & Swar Grid) */
    .grid-items-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 8px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .item-chip-card {
      background: #FFFFFF;
      border: 2px solid #E0E0E0;
      border-radius: 18px;
      padding: 10px 4px;
      text-align: center;
      box-shadow: 0 3px 0 #EEEEEE;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .item-chip-card:active {
      transform: scale(0.92);
    }
    .chip-letter {
      font-size: 22px;
      font-weight: 900;
      color: #2E7D32;
      pointer-events: none;
    }
    .chip-emoji {
      font-size: 32px;
      margin: 4px 0;
      display: inline-block;
      pointer-events: none;
    }
    .chip-word {
      font-size: 11px;
      font-weight: 700;
      color: #616161;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Word Building & Puzzle Chips */
    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
    }
    .slot-box {
      width: 54px;
      height: 54px;
      border: 3px dashed #90A4AE;
      border-radius: 16px;
      background: #ECEFF1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #263238;
      cursor: pointer;
    }
    .slot-box.filled {
      border: 3px solid #4CAF50;
      background: #E8F5E9;
      color: #2E7D32;
    }
    .letters-tray {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .letter-bubble {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #FFEB3B;
      border: 3px solid #FBC02D;
      box-shadow: 0 4px 0 #F57F17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #795548;
      cursor: pointer;
      transition: all 0.1s;
    }
    .letter-bubble:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #F57F17;
    }

    /* Memory Flip Game */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 380px;
      margin: 14px auto;
    }
    .memory-card {
      aspect-ratio: 1;
      perspective: 1000px;
      cursor: pointer;
    }
    .memory-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s;
      transform-style: preserve-3d;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .memory-card.flipped .memory-card-inner {
      transform: rotateY(180deg);
    }
    .memory-front, .memory-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      font-size: 32px;
      border: 3px solid transparent;
      pointer-events: none;
    }
    .memory-front {
      background: linear-gradient(135deg, #FF80AB 0%, #FF4081 100%);
      color: #fff;
      border-color: #F50057;
      font-weight: 900;
    }
    .memory-back {
      background: #FFFFFF;
      border-color: #4CAF50;
      transform: rotateY(180deg);
    }

    /* Feedback Animations & Toast */
    .toast-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(33, 33, 33, 0.92);
      color: #fff;
      padding: 18px 32px;
      border-radius: 30px;
      font-size: 26px;
      font-weight: 900;
      z-index: 999;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .toast-overlay.show {
      transform: translate(-50%, -50%) scale(1);
    }
    .toast-overlay.success {

    .matching-board-container {

    }
    .matching-card {
      position: relative;
      display: flex;
      align-items: center;

      cursor: pointer;
      touch-action: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;

      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      min-height: 76px;
    }
    .matching-card:active {
      transform: scale(0.96);
    }
    .matching-card.matching-left {
      background: #E3F2FD;
      border: 2.5px solid #90CAF9;
      justify-content: space-between;
    }
    .matching-card.matching-right {
      background: #FFF3E0;
      border: 2.5px solid #FFCC80;
      justify-content: flex-start;
      gap: 8px;
    }
    .matching-card.selected-matching-card {
      border-color: #FF9800 !important;

      transform: scale(1.03);

    .matching-card.matched-matching-card {

      background: #E8F5E9 !important;
      box-shadow: 0 2px 8px rgba(76,175,80,0.25) !important;

    .matching-card.shake-wrong {
      animation: shakeCard 0.4s ease-in-out;
      border-color: #F44336 !important;
      background: #FFEBEE !important;

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .letter-key-shake {

      color: #B71C1C !important;
      box-shadow: 0 0 10px rgba(229, 57, 53, 0.4) !important;

      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-7px); }
      30%, 60%, 90% { transform: translateX(7px); }
    }

  <script>
    /* =========================================================
       AUDIO & SPEECH SYNTHESIS ENGINE (Capacitor Native TTS + Web Audio Pop)
       ========================================================= */
    var appSoundEnabled = true;
    var lastUtteranceKey = "";
    var currentSpeechTimeout = null;
    // Fast non-blocking action executor: 0ms instant execution, reliable pop & clean error isolation
    function safeAction(fn, ev) {
      if (ev && ev.stopPropagation) {
        try { ev.stopPropagation(); } catch (e) {}
      }
      unlockAudioContext();
      playTone("pop");
      if (typeof fn === "function") {
        try { fn(); } catch (err) { console.error(err); }
      }
    }

    // Web Audio Synthesizer: 100% reliable sound on all devices & WebViews
    var audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      return audioCtx;
    }

    function unlockAudioContext() {
      var ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    ['touchstart', 'touchend', 'click', 'pointerdown'].forEach(function(ev) {
      window.addEventListener(ev, unlockAudioContext, { passive: true });
    });

    function playTone(type) {
      if (!appSoundEnabled) return;
      try {
        var ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') ctx.resume();
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "pop") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "success") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          osc.frequency.setValueAtTime(1046.50, now + 0.28);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === "win") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.12);
          osc.frequency.setValueAtTime(1174.66, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        }
      } catch (e) {}
    }

    // Hybrid TTS Engine: Capacitor Native TTS first, Web Speech API fallback
    var availableVoices = [];
    function loadVoices() {
      if (window.speechSynthesis) {
        availableVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function containsHindi(str) {
      return /[\u0900-\u097F]/.test(str);
    }

    function speak(text, lang) {
      if (!appSoundEnabled || !text) return;
      var cleanText = String(text).replace(/___+/g, 'blank');
      var targetLang = lang || (containsHindi(cleanText) ? "hi-IN" : "en-IN");

      // Non-blocking asynchronous TTS invocation so rendering thread never freezes
      setTimeout(function() {
        try {
          var cap = window.Capacitor;
          var ttsPlugin = (cap && cap.Plugins && cap.Plugins.TextToSpeech) || (window.plugins && window.plugins.tts);
          if (ttsPlugin) {
            try {
              if (ttsPlugin.stop) {
                try { ttsPlugin.stop().catch(function(){}); } catch(e) {}
              }
              ttsPlugin.speak({
                text: cleanText,
                lang: targetLang,
                rate: 0.9,
                pitch: 1.0,
                volume: 1.0,
                category: 'ambient'
              }).catch(function() {
                fallbackWebSpeech(cleanText, targetLang);
              });
              return;
            } catch(err) {}
          }
          fallbackWebSpeech(cleanText, targetLang);
        } catch (err) {}
      }, 0);
    }

    function fallbackWebSpeech(text, targetLang) {
      if (!window.speechSynthesis) return;
      try {
        try { window.speechSynthesis.cancel(); } catch(e) {}
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = targetLang;
        utterance.rate = 0.88;
        utterance.pitch = 1.05;

        if (availableVoices.length > 0) {
          var matchedVoice = availableVoices.find(function(v) {
            return v.lang && v.lang.toLowerCase().indexOf(targetLang.toLowerCase().slice(0, 2)) !== -1;
          });
          if (matchedVoice) utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function autoSpeak(key, text, lang) {
      if (lastUtteranceKey === key) return;
      lastUtteranceKey = key;
      if (currentSpeechTimeout) clearTimeout(currentSpeechTimeout);
      currentSpeechTimeout = setTimeout(function() {
        speak(text, lang);
      }, 40);
    }

    function toggleSound() {
      appSoundEnabled = !appSoundEnabled;
      document.getElementById("sound-icon").textContent = appSoundEnabled ? "🔊" : "🔇";
      if (!appSoundEnabled) {
        if (window.speechSynthesis) window.speechSynthesis.cancel();

        speak("Sound On", "en-IN");

    /* =========================================================
       CONFETTI CELEBRATION ENGINE

    var confettiCanvas = document.getElementById("confetti-canvas");
    var confettiCtx = confettiCanvas.getContext("2d");
    var confettiParticles = [];
    var confettiAnimId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      confettiParticles = [];
      var colors = ["#FF5252", "#FFEB3B", "#4CAF50", "#2196F3", "#E040FB", "#FF9800"];
      for (var i = 0; i < 70; i++) {
        confettiParticles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height / 3,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.35,
          alpha: 1
        });
      }
      if (!confettiAnimId) renderConfetti();
    }

    function renderConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      var stillActive = false;
      for (var i = 0; i < confettiParticles.length; i++) {
        var p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.012;
        if (p.alpha > 0) {
          stillActive = true;
          confettiCtx.save();
          confettiCtx.globalAlpha = p.alpha;
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate((p.rotation * Math.PI) / 180);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          confettiCtx.restore();
        }
      }
      if (stillActive) {
        confettiAnimId = requestAnimationFrame(renderConfetti);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiAnimId = null;
      }
    }

    // Student Login Verification Handler (Supabase live verify + offline fallback)
    async function handleStudentLoginSubmit() {
      var input = document.getElementById("student-login-input");
      var id = input ? input.value.trim() : "";
      if (!id) {
        showToast("Please enter Admission No. or Mobile No.", "wrong");
        speak("Please enter your Admission Number or Mobile Number.", "en-IN");
        return;
      }

      showToast("Verifying Active Student Pass...", "success");

      // 1. Try Supabase RPC live verification
      try {
        var res = await supabaseRest("/rpc/kids_verify_student", {
          method: "POST",
          body: { p_identifier: id }
        });
        if (res && res.success && res.student) {
          activateStudentSession(res.student);
          return;
        }
      } catch (err) {
        console.log("Supabase RPC live verify check:", err.message || err);
      }

      // 2. Offline / local fallback check against registered school students
      var cleanId = id.toUpperCase();
      var found = DEFAULT_STUDENTS_ROSTER.find(function(s) {
        return s.admission_no.toUpperCase() === cleanId ||
               s.student_id.toUpperCase() === cleanId ||
               s.mobile === id ||
               s.student_name.toUpperCase().includes(cleanId);
      });

      if (!found) {
        // Create an active student record for new valid admission
        found = {
          student_id: "STU-" + Math.floor(100 + Math.random() * 900),
          admission_no: id.startsWith("ADM-") ? id : ("ADM-" + id),
          student_name: "School Student " + id,
          class_name: "UKG",
          total_stars: 10,
          tasks_completed: 1,
          badges: ["Welcome Explorer 🌟"]
        };
      }

      activateStudentSession(found);
    }

    async function handleAssignHomeworkSubmit() {
      var select = document.getElementById("teacher-hw-select");
      var targetInput = document.getElementById("teacher-hw-target");
      if (!select) return;
      var key = select.value;
      var targetQuestions = parseInt(targetInput ? targetInput.value : "10", 10) || 10;
      var modules = getCurriculumModulesForClass(appSession.teacherClass);
      var selectedMod = modules.find(function(m) { return m.key === key; }) || modules[0];

      var newHw = {
        id: "HW-" + Date.now(),
        class_name: appSession.teacherClass,
        title: selectedMod.title,
        module_key: selectedMod.key,
        target_questions: targetQuestions,
        assigned_by: "Class Teacher",
        created_at: (new Date()).toISOString()
      };

      // 1. Try Supabase insert
      try {
        await supabaseRest("/kids_homework", {
          method: "POST",
          body: newHw
        });
      } catch (err) {
        console.log("Supabase insert homework note:", err.message || err);
      }

      // 2. Save in local cache
      var hwList = JSON.parse(localStorage.getItem("taa_kids_homework") || "[]");
      hwList.unshift(newHw);
      localStorage.setItem("taa_kids_homework", JSON.stringify(hwList));

      playTone("fanfare");
      showToast("Homework assigned to " + appSession.teacherClass + "! Active 48h.", "success");
      speak("Homework assigned to " + appSession.teacherClass + " class. Live tracking active for 48 hours.", "en-IN");
      renderTeacherPanelView();
    }

    // Get today's active homework for a class (within 48 hours)
    function getTodayActiveHomework(className) {
      var cutoff = Date.now() - (48 * 60 * 60 * 1000);
      var hwList = JSON.parse(localStorage.getItem("taa_kids_homework") || "[]");
      for (var i = 0; i < hwList.length; i++) {
        var h = hwList[i];
        if (h.class_name === className && (new Date(h.created_at)).getTime() >= cutoff) {
          return h;
        }
      }
      // Default initial homework if none assigned yet
      var defaultModules = getCurriculumModulesForClass(className);
      return {
        id: "HW-DEF-" + className,
        class_name: className,
        title: defaultModules[0].title,
        module_key: defaultModules[0].key,
        target_questions: 10,
        assigned_by: "Class Teacher",
        created_at: (new Date()).toISOString()
      };
    }

    // Check if a student has completed a homework
    function isHomeworkCompletedByStudent(studentId, homeworkId) {
      var subList = JSON.parse(localStorage.getItem("taa_kids_submissions") || "[]");
      return subList.some(function(s) {
        return s.student_id === studentId && s.homework_id === homeworkId && s.status === "completed";
      });
    }

    // Get roster for teacher class with live 2-day submission status
    function getRosterForClass(className) {
      var hw = getTodayActiveHomework(className);
      var students = DEFAULT_STUDENTS_ROSTER.filter(function(s) { return s.class_name === className; });
      if (appSession.student && appSession.student.class_name === className) {
        if (!students.some(function(s) { return s.student_id === appSession.student.student_id; })) {
          students.push(appSession.student);
        }
      }
      return students.map(function(s) {
        var completed = hw ? isHomeworkCompletedByStudent(s.student_id, hw.id) : false;
        return {
          student_id: s.student_id,
          admission_no: s.admission_no,
          student_name: s.student_name,
          total_stars: s.total_stars || 0,
          badges: s.badges || ["Welcome Explorer 🌟"],
          status: completed ? "completed" : "pending"
        };
      });
    }

    function calculateStudentRank(studentId, className) {
      var students = DEFAULT_STUDENTS_ROSTER.filter(function(s) { return s.class_name === className; });
      if (appSession.student && appSession.student.class_name === className) {
        if (!students.some(function(s) { return s.student_id === appSession.student.student_id; })) {
          students.push(appSession.student);
        }
      }
      students.sort(function(a, b) { return (b.total_stars || 0) - (a.total_stars || 0); });
      var idx = students.findIndex(function(s) { return s.student_id === studentId; });
      return (idx >= 0 ? idx + 1 : 1);
    }

    function timeAgo(dateString) {
      var sec = Math.floor((Date.now() - (new Date(dateString)).getTime()) / 1000);
      if (sec < 60) return "just now";
      var min = Math.floor(sec / 60);
      if (min < 60) return min + "m ago";
      var hrs = Math.floor(min / 60);
      return hrs + "h ago";
    }

    /* =========================================================
       UNIVERSAL QUIZ & FISHER-YATES SHUFFLE CONTROLLER
       ========================================================= */
    var quizState = {
      isAnswered: false,
      activeKey: "",
      correctItem: null,
      optionsCache: {}
    };

    function resetQuizQuestionState() {
      quizState.isAnswered = false;
      quizState.activeKey = "";
      quizState.correctItem = null;
      quizState.optionsCache = {};
    }

    function fisherYatesShuffle(arr) {
      if (!arr || !Array.isArray(arr)) return [];
      var copy = arr.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function getShuffledOptions(key, generatorFn) {
      if (!quizState.optionsCache) quizState.optionsCache = {};
      if (quizState.optionsCache[key]) {
        return quizState.optionsCache[key];
      }
      var generated = (typeof generatorFn === "function") ? generatorFn() : [];
      quizState.optionsCache[key] = generated;
      return generated;
    }

    function handleQuizAnswerSubmit(isCorrect, config) {
      if (quizState.isAnswered && quizState.activeKey === config.key) return;

      if (isCorrect) {
        quizState.isAnswered = true;
        quizState.activeKey = config.key;
        quizState.correctItem = config;

        playTone("success");
        triggerConfetti();
        addStar("🎉 Awesome! Correct answer!", config.spoken || "Awesome! Correct!", config.lang || "en-IN");
        renderCurrentView();
      } else {
        markWrong(config.wrongMsg || "Try again!", config.lang || "en-IN");
      }
    }

    function speakCompletedAgain() {
      if (quizState.correctItem) {
        speak(quizState.correctItem.spoken, quizState.correctItem.lang || "en-IN");
      }
    }

    function advanceNextQuestion() {
      var item = quizState.correctItem;
      resetQuizQuestionState();
      if (item && typeof item.advanceFn === "function") {
        item.advanceFn();
      } else {
        appState.quizIndex++;
        renderCurrentView();
      }
    }

    function renderCompletedPreviewCard() {
      if (!quizState.isAnswered || !quizState.correctItem) return "";
      var item = quizState.correctItem;
      var html = "";
      html += '<div class="completed-answer-card">';
      html += '  <div class="completed-big-text">' + (item.display || "") + '</div>';
      html += '  <div style="display: flex; justify-content: center; gap: 12px; margin-top: 10px; flex-wrap: wrap;">';
      html += '    <button class="btn-listen-again" onclick="event.stopPropagation(); speakCompletedAgain();">🔊 Listen Again</button>';
      html += '    <button class="btn-next-question" onclick="event.stopPropagation(); advanceNextQuestion();">Next Question ➔</button>';
      html += '  </div>';
      html += '</div>';
      return html;
    }

    function getNumberWord(n) {
      var ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                  "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      var tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
      if (n <= 19) return ones[n];
      if (n === 100) return "One Hundred";
      var t = Math.floor(n / 10);
      var rem = n % 10;
      return tens[t] + (rem > 0 ? ("-" + ones[rem]) : "");
    }

    /* ---------------------------------------------------------
       DATA: BEFORE, AFTER, BETWEEN (50+ Procedural Generator)
       --------------------------------------------------------- */
    function generateBeforeAfterList() {
      var list = [];
      // 1. Numbers (1-50): Before, After, Between
      for (var n = 2; n <= 48; n += 2) {
        // After
        list.push({
          q: "What comes AFTER " + (n+1) + "?",
          prompt: n + ", " + (n+1) + ", <span class=\"dash-blank\">___</span>",
          ans: String(n + 2),
          options: [String(n + 2), String(n + 3), String(n - 1)],
          lang: "en-IN",
          speak: n + ", " + (n+1) + ", blank. What comes after " + (n+1) + "?"
        });
        // Before
        list.push({
          q: "What comes BEFORE " + (n+1) + "?",
          prompt: "<span class=\"dash-blank\">___</span>, " + (n+1) + ", " + (n+2),
          ans: String(n),
          options: [String(n), String(n + 3), String(Math.max(1, n - 2))],
          lang: "en-IN",
          speak: "Blank, " + (n+1) + ", " + (n+2) + ". What comes before " + (n+1) + "?"
        });
        // Between
        list.push({
          q: "What comes BETWEEN " + n + " and " + (n+2) + "?",
          prompt: n + ", <span class=\"dash-blank\">___</span>, " + (n+2),
          ans: String(n + 1),
          options: [String(n + 1), String(n - 1), String(n + 3)],
          lang: "en-IN",
          speak: n + ", blank, " + (n+2) + ". What comes between " + n + " and " + (n+2) + "?"
        });
      }

      // 2. Alphabets A-Z (English)
      var azPairs = [
        { seq: ["A", "B", "___"], ans: "C", q: "What comes after B?", sp: "A, B, blank. What comes after B?" },
        { seq: ["___", "E", "F"], ans: "D", q: "What comes before E?", sp: "Blank, E, F. What comes before E?" },

    function getActiveTabKey() {
      var tabs = SECTION_TABS[appState.section] || [];
      if (tabs.length === 0) return "";
      if (appState.tabKey) {
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].key === appState.tabKey) {
            appState.tabIndex = i;
            return appState.tabKey;
          }
        }
      }
      var idx = (typeof appState.tabIndex === "number" && appState.tabIndex >= 0 && appState.tabIndex < tabs.length) ? appState.tabIndex : 0;
      appState.tabIndex = idx;
      appState.tabKey = tabs[idx] ? tabs[idx].key : "";
      return appState.tabKey;
    }

    function openSection(secName, tabTarget) {
      lastUtteranceKey = "";

    function setTab(target) {
      lastUtteranceKey = "";
      appState.quizIndex = 0;
      appState.mode = "learn";
      resetQuizQuestionState();

      var tabs = SECTION_TABS[appState.section] || [];
      if (typeof target === "string") {
        var foundIdx = -1;
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].key === target) { foundIdx = i; break; }
        }
        if (foundIdx !== -1) {
          appState.tabKey = target;
          appState.tabIndex = foundIdx;
        } else {
          appState.tabKey = tabs[0] ? tabs[0].key : "";
          appState.tabIndex = 0;
        }
      } else {
        var idx = (typeof target === "number" && target >= 0 && target < tabs.length) ? target : 0;
        appState.tabIndex = idx;
        appState.tabKey = tabs[idx] ? tabs[idx].key : "";
      }

      if (appState.section === "lkg" && appState.tabKey === "shabda") {
        initShabdaNirman();
      } else if (appState.section === "brain_booster" && appState.tabKey === "memory") {
        initMemoryGame();
      }

      renderSubtabs();
      renderCurrentView();

      setTimeout(function() {
        var bar = document.getElementById("subtabs-bar");
        if (bar && bar.children && bar.children[appState.tabIndex]) {
          try { bar.children[appState.tabIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); } catch(e) {}

      var nextNeeded = null;
      for (var i = 0; i < curRound.missing.length; i++) {
        if (appState.nurseryHindiMissingFilled.indexOf(curRound.missing[i]) === -1) {

    function updateMatchingSvgLines() {
      var svg = document.getElementById("matching-svg");
      var board = document.getElementById("matching-board");
      if (!svg || !board) return;
      var bRect = board.getBoundingClientRect();
      var linesHtml = "";

      for (var i = 0; i < lineDrawingState.matchedPairs.length; i++) {
        var pair = lineDrawingState.matchedPairs[i];
        var leftDot = board.querySelector('.matching-dot[data-id="' + pair.leftId + '"]');
        var rightDot = board.querySelector('.matching-dot[data-id="' + pair.rightId + '"]');
        if (leftDot && rightDot) {
          var lRect = leftDot.getBoundingClientRect();
          var rRect = rightDot.getBoundingClientRect();
          var x1 = lRect.left + lRect.width / 2 - bRect.left;
          var y1 = lRect.top + lRect.height / 2 - bRect.top;
          var x2 = rRect.left + rRect.width / 2 - bRect.left;
          var y2 = rRect.top + rRect.height / 2 - bRect.top;
          linesHtml += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#4CAF50" stroke-width="6" stroke-linecap="round" />';
          linesHtml += '<circle cx="' + x1 + '" cy="' + y1 + '" r="6" fill="#4CAF50" />';
          linesHtml += '<circle cx="' + x2 + '" cy="' + y2 + '" r="6" fill="#4CAF50" />';
        }
      }

      if (lineDrawingState.isDrawing && lineDrawingState.startDot) {
        var sx = lineDrawingState.startDot.x;
        var sy = lineDrawingState.startDot.y;
        var cx = lineDrawingState.currentPos.x;
        var cy = lineDrawingState.currentPos.y;
        linesHtml += '<line x1="' + sx + '" y1="' + sy + '" x2="' + cx + '" y2="' + cy + '" stroke="#2196F3" stroke-width="5" stroke-linecap="round" stroke-dasharray="8,6" />';
        linesHtml += '<circle cx="' + sx + '" cy="' + sy + '" r="7" fill="#2196F3" />';
        linesHtml += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#FF9800" />';
      }

      if (lineDrawingState.wrongLine) {
        var wl = lineDrawingState.wrongLine;
        linesHtml += '<line x1="' + wl.x1 + '" y1="' + wl.y1 + '" x2="' + wl.x2 + '" y2="' + wl.y2 + '" stroke="#F44336" stroke-width="5" stroke-linecap="round" />';
      }

      svg.innerHTML = linesHtml;
    }

    function handleMatchPointerDown(e, side, id, val, word) {
      if (e.button && e.button !== 0) return;
      var board = document.getElementById("matching-board");
      if (!board) return;

      for (var i = 0; i < lineDrawingState.matchedPairs.length; i++) {
        var mp = lineDrawingState.matchedPairs[i];
        if (side === "left" && mp.leftId === id) return;
        if (side === "right" && mp.rightId === id) return;
      }

      var bRect = board.getBoundingClientRect();
      var card = e.currentTarget;
      var dot = card.querySelector(".matching-dot");
      var dRect = (dot || card).getBoundingClientRect();
      var sx = dRect.left + dRect.width / 2 - bRect.left;
      var sy = dRect.top + dRect.height / 2 - bRect.top;

      lineDrawingState.isDrawing = true;
      lineDrawingState.startDot = {
        side: side,
        id: id,
        val: val,
        word: word,
        x: sx,
        y: sy,
        startX: e.clientX,
        startY: e.clientY
      };
      lineDrawingState.currentPos = { x: sx, y: sy };

      try {
        if (card.setPointerCapture && e.pointerId !== undefined) {
          card.setPointerCapture(e.pointerId);
        }
      } catch (err) {}

      updateMatchingSvgLines();
    }

    function handleMatchPointerMove(e) {
      if (!lineDrawingState.isDrawing || !lineDrawingState.startDot) return;
      var board = document.getElementById("matching-board");
      if (!board) return;
      var bRect = board.getBoundingClientRect();
      lineDrawingState.currentPos = {
        x: e.clientX - bRect.left,
        y: e.clientY - bRect.top
      };
      updateMatchingSvgLines();
    }

    function handleMatchPointerUp(e) {
      if (!lineDrawingState.isDrawing || !lineDrawingState.startDot) return;
      var start = lineDrawingState.startDot;
      lineDrawingState.isDrawing = false;

      try {
        if (e.currentTarget && e.currentTarget.releasePointerCapture && e.pointerId !== undefined) {
          e.currentTarget.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}

      var targetElem = document.elementFromPoint(e.clientX, e.clientY);
      var targetCard = targetElem ? targetElem.closest(".matching-card") : null;

      if (targetCard) {
        var targetSide = targetCard.getAttribute("data-side");
        var targetId = targetCard.getAttribute("data-id");
        var targetVal = targetCard.getAttribute("data-val");
        var targetWord = targetCard.getAttribute("data-word");

        if (targetSide && targetSide !== start.side) {
          evaluateMatchingPair(start, {
            side: targetSide,
            id: targetId,
            val: targetVal,
            word: targetWord
          });
          updateMatchingSvgLines();
          return;
        }
      }

      var dist = Math.hypot(e.clientX - start.startX, e.clientY - start.startY);
      if (dist < 12) {
        handleMatchCardTap(start.side, start.id, start.val, start.word);
      } else {
        updateMatchingSvgLines();
      }
    }

    function handleMatchCardTap(side, id, val, word) {
      for (var i = 0; i < lineDrawingState.matchedPairs.length; i++) {
        var mp = lineDrawingState.matchedPairs[i];
        if (side === "left" && mp.leftId === id) return;
        if (side === "right" && mp.rightId === id) return;
      }

      if (getActiveTabKey() === "swar") {
        if (!lineDrawingState.selectedDot) {
          lineDrawingState.selectedDot = { side: side, id: id, val: val, word: word };

          return;
        }
        if (lineDrawingState.selectedDot.side === side) {
          lineDrawingState.selectedDot = { side: side, id: id, val: val, word: word };
          highlightSelectedCard(side, id);
          speak(side === "left" ? ("अक्षर " + val) : (word || val), "hi-IN");
          return;
        }
        var firstDotH = lineDrawingState.selectedDot;
        lineDrawingState.selectedDot = null;
        clearCardHighlights();
        evaluateMatchingPair(firstDotH, { side: side, id: id, val: val, word: word });
        updateMatchingSvgLines();
        return;
      }

      if (!lineDrawingState.selectedDot) {
        lineDrawingState.selectedDot = { side: side, id: id, val: val, word: word };
        highlightSelectedCard(side, id);
        if (appState.nurseryAbcSubTab === "match_picture") {
          speak(side === "left" ? "Letter " + val : (word || val), "en-IN");
        } else if (appState.nurseryAbcSubTab === "match_small") {
          speak(side === "left" ? "Capital " + val : "Small " + val.toLowerCase(), "en-IN");
        } else {
          speak("Letter " + val, "en-IN");
        }
        return;
      }

      if (lineDrawingState.selectedDot.side === side) {
        lineDrawingState.selectedDot = { side: side, id: id, val: val, word: word };
        highlightSelectedCard(side, id);
        if (appState.nurseryAbcSubTab === "match_picture") {

        } else {
          speak("Letter " + val, "en-IN");
        }
        return;
      }

      var firstDot = lineDrawingState.selectedDot;
      lineDrawingState.selectedDot = null;
      clearCardHighlights();
      evaluateMatchingPair(firstDot, { side: side, id: id, val: val, word: word });
      updateMatchingSvgLines();
    }

    function evaluateMatchingPair(dot1, dot2) {
      var leftDot = dot1.side === "left" ? dot1 : dot2;
      var rightDot = dot1.side === "right" ? dot1 : dot2;

      for (var i = 0; i < lineDrawingState.matchedPairs.length; i++) {
        var mp = lineDrawingState.matchedPairs[i];
        if (mp.leftId === leftDot.id || mp.rightId === rightDot.id) return;
      }

      if (getActiveTabKey() === "swar") {
        if (leftDot.val === rightDot.val) {
          lineDrawingState.matchedPairs.push({
            leftId: leftDot.id,
            rightId: rightDot.id,
            val: leftDot.val
          });
          playTone("success");
          var speechText = "";
          if (appState.nurseryHindiSubTab === "match_pic") {
            speechText = leftDot.val + " से " + (rightDot.word || leftDot.word || "") + "! बहुत बढ़िया!";

            speechText = "अक्षर " + leftDot.val + "! बहुत अच्छे!";

          leftId: leftDot.id,
          rightId: rightDot.id,
          val: leftDot.val
        });

          speechText = leftDot.val + " for " + (rightDot.word || leftDot.word || "") + "! Great job!";

      var nextNeeded = null;
      for (var i = 0; i < curRound.missing.length; i++) {
        if (appState.nurseryNumMissingFilled.indexOf(curRound.missing[i]) === -1) {

        playTone("success");
        speak(tappedNum + "! " + getNumberWord(tappedNum) + "! Good job!", "en-IN");

      var targetList = category === "vowels" ? DATA_VOWELS : (category === "semi_vowels" ? DATA_SEMI_VOWELS : DATA_CONSONANTS);
      var catTitle = category === "vowels" ? "Vowel" : (category === "semi_vowels" ? "Semi-Vowel" : "Consonant");
      var filled = getLetterPracticeFilled(category);

      // Prevent tapping already placed letter
      if (filled.indexOf(letter) !== -1) return;

      var isCorrect = (targetList.indexOf(letter) !== -1);

      if (isCorrect) {
        // Place in next available empty slot (___)
        filled.push(letter);
        playTone("pop");
        speak(letter + " is a " + catTitle + "!", "en-IN");

        var isComplete = (filled.length === targetList.length);
        if (isComplete) {
          setTimeout(function() {

            triggerConfetti();
          }, 350);

        renderCurrentView();

        playTone("wrong");
        var actualCat = getLetterCategoryName(letter);
        var feedbackMsg = letter + " is a " + actualCat + ", find a " + catTitle + "!";
        speak(feedbackMsg, "en-IN");

      speak(char, "hi-IN");
      var wordObj = DATA_SHABDA[appState.wordCurrentIndex % DATA_SHABDA.length];
      if (appState.wordSlots.length < wordObj.letters.length) {
        appState.wordSlots.push(char);

          var builtWord = appState.wordSlots.join("");
          if (builtWord === wordObj.word) {
            handleQuizAnswerSubmit(true, {
              key: "shabda_" + appState.wordCurrentIndex,

              spoken: wordObj.sound + "! " + wordObj.word + "!",
              lang: "hi-IN",
              ansVal: wordObj.word,
              advanceFn: function() {
                appState.wordCurrentIndex++;
                appState.wordSlots = [];
                renderCurrentView();
              }
            });
          } else {
            markWrong("गलत शब्द बना, दोबारा जोड़ें", "hi-IN");
            setTimeout(function() {
              appState.wordSlots = [];
              renderCurrentView();

      }

        spoken: a + " " + opWord + " " + b + " equals " + ans + "! Correct!",
        lang: "en-IN",
        ansVal: ans,
        wrongMsg: "Incorrect count, try again!"
      });
    }

    function handlePicWorldAns(isCorrect, en, emoji) {
      var cacheKey = "picworld_" + appState.picCategory + "_" + appState.quizIndex;
      handleQuizAnswerSubmit(isCorrect, {
        key: cacheKey,
        display: en + " " + (emoji || ""),
        spoken: "Very good! That is " + en + "!",
        lang: "en-IN",
        ansVal: en,
        wrongMsg: "That is " + en + ". Try again!"
      });
    }

    function initMemoryGame() {
      var pool = ["🦁", "🍎", "🚗", "🦚", "🐘", "⭐"];
      var doublePool = pool.concat(pool);
      doublePool.sort(function() { return Math.random() - 0.5; });
      appState.memCards = doublePool;
      appState.memFlipped = [];
      appState.memMatched = [];
      autoSpeak("mem_init", "Memory Flip Game. Tap cards to find matching pairs!", "en-IN");
    }

    var MEM_NAMES = {
      "🦁": "Lion",
      "🍎": "Apple",
      "🚗": "Car",
      "🦚": "Peacock",
      "🐘": "Elephant",
      "⭐": "Star"
    };

    function tapMemoryCard(idx) {
      if (appState.memFlipped.length >= 2) return;
      if (appState.memFlipped.indexOf(idx) !== -1) return;
      var cardIcon = appState.memCards[idx];
      if (appState.memMatched.indexOf(cardIcon) !== -1) return;

      speak(MEM_NAMES[cardIcon] || "Card", "en-IN");
      appState.memFlipped.push(idx);
      renderCurrentView();

      if (appState.memFlipped.length === 2) {
        var idx1 = appState.memFlipped[0];
        var idx2 = appState.memFlipped[1];
        var icon1 = appState.memCards[idx1];
        var icon2 = appState.memCards[idx2];

        if (icon1 === icon2) {
          appState.memMatched.push(icon1);
          addStar("Pair Matched: " + (MEM_NAMES[icon1] || ""), "Match found! " + (MEM_NAMES[icon1] || "") + "! Super!", "en-IN");
          appState.memFlipped = [];

          if (appState.memMatched.length === appState.memCards.length / 2) {
            setTimeout(function() {
              playTone("win");
              showToast("🏆 You Won the Game!", "success");
              speak("Congratulations! You matched all pairs!", "en-IN");
            }, 600);
          }
        } else {
          setTimeout(function() {
            playTone("wrong");
            appState.memFlipped = [];
            renderCurrentView();
          }, 850);
        }
      }
    }

    function handleShadowAns(isCorrect, name, emoji) {
      var cacheKey = "shadow_" + appState.brainIndex;
      handleQuizAnswerSubmit(isCorrect, {
        key: cacheKey,
        display: "Match: " + name + " " + (emoji || ""),
        spoken: "Great match! Perfect shadow of " + name + "!",
        lang: "en-IN",
        ansVal: name,
        advanceFn: function() { appState.brainIndex++; renderCurrentView(); },
        wrongMsg: "Not the right shadow, try again!"
      });
    }

    function handleOddAns(isOdd, reason, name, emoji) {
      if (name) speak(name, "en-IN");
      var cacheKey = "odd_" + appState.brainIndex;
      handleQuizAnswerSubmit(isOdd, {
        key: cacheKey,
        display: "Odd One Out: " + name + " " + (emoji || ""),
        spoken: "Awesome! " + name + " is the odd one out! " + (reason || ""),
        lang: "en-IN",
        ansVal: name,
        advanceFn: function() { appState.brainIndex++; renderCurrentView(); },
        wrongMsg: "This belongs to the group, look closely!"
      });
    }

    /* =========================================================
       MASTER VIEW RENDER DISPATCHER
       ========================================================= */
    function renderCurrentView() {
      if (appState.section === "welcome") {
        renderWelcomeView();
      } else if (appState.section === "teacher") {
        renderTeacherPanelView();
      } else if (appState.section === "home") {
        renderHome();
      } else if (appState.section === "nursery") {
        renderNurseryView();
      } else if (appState.section === "lkg") {
        renderLkgView();
      } else if (appState.section === "ukg") {
        renderUkgView();
      } else if (appState.section === "picture_world") {
        renderPictureWorldView();
      } else if (appState.section === "brain_booster") {
        renderBrainBoosterView();
      }
    }

    // Initial load
    window.addEventListener("DOMContentLoaded", function() {
      unlockAudioContext();
      runDaily48HourCleanup();
      var sessionType = restoreSession();
      if (!sessionType) {
        appState.section = "welcome";
        renderWelcomeView();
      } else if (sessionType === "teacher") {
        openTeacherPanel();
      } else {
        goHome();
      }
    });
  </script>
</body>
</html>
